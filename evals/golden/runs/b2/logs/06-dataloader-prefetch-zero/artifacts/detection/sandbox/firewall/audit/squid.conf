# Squid configuration for egress traffic control
# Generated by awf


# Disable pinger (ICMP) - requires NET_RAW capability which we don't have for security
pinger_enable off

# PID file location - use proxy-owned directory since container runs as non-root
pid_filename /var/run/squid/squid.pid

# Custom log format with detailed connection information
# Format: timestamp client_ip:port dest_domain dest_ip:port protocol method status decision url user_agent
# Note: For CONNECT requests (HTTPS), the domain is in the URL field
logformat firewall_detailed %ts.%03tu %>a:%>p %{Host}>h %<a:%<p %rv %rm %>Hs %Ss:%Sh %ru "%{User-Agent}>h"

# Structured JSONL audit log for machine-readable analysis
# Note: Squid logformat does not JSON-escape strings, so fields like User-Agent
# could break JSON parsing. We omit User-Agent to reduce breakage risk.
logformat audit_jsonl {"_schema":"audit/v0.28.70","timestamp":"%{%Y-%m-%dT%H:%M:%S}tg.%03tuZ","event":"http_access","client":"%>a","host":"%{Host}>h","dest":"%<a:%<p","method":"%rm","status":%>Hs,"decision":"%Ss","url":"%ru"}

# Access log and cache configuration
# Don't log healthcheck probes from localhost (using ACL filter on access_log)
acl healthcheck_localhost src 127.0.0.1 ::1

access_log /var/log/squid/access.log firewall_detailed !healthcheck_localhost 
access_log /var/log/squid/audit.jsonl audit_jsonl !healthcheck_localhost 
cache_log /var/log/squid/cache.log
cache deny all

# No domains configured


# Port configuration

# TLS SNI allowlist enforcement
# Squid peeks only at the TLS ClientHello, then splices allowed connections
# without decrypting application traffic. The listener certificate is an
# ephemeral, untrusted bootstrap certificate and is never presented when these
# splice/terminate rules operate as configured.
http_port 3128 ssl-bump cert=/var/run/squid/awf-sni-guard-cert.pem key=/var/run/squid/awf-sni-guard-key.pem generate-host-certificates=off options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1
http_port [::]:3128 ssl-bump cert=/var/run/squid/awf-sni-guard-cert.pem key=/var/run/squid/awf-sni-guard-key.pem generate-host-certificates=off options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

acl tls_sni_guard_step1 at_step SslBump1
acl tls_sni_guard_step2 at_step SslBump2
acl tls_sni_guard_port port 443



acl tls_sni_guard_api_proxy src 172.30.0.30/32

# Trusted AWF-owned sidecars retain their existing scoped egress behavior.
ssl_bump splice tls_sni_guard_api_proxy
# CONNECT is also used for non-TLS traffic to explicitly allowed sidecar ports.
ssl_bump splice !tls_sni_guard_port
# Preserve explicit IP allowlisting for TLS clients, which normally omit SNI.


# For agent HTTPS traffic, inspect the ClientHello and require its actual SNI
# to be allowlisted. --client-requested prevents fallback to the CONNECT host
# when the client omits SNI.
ssl_bump peek tls_sni_guard_step1


ssl_bump terminate tls_sni_guard_step2
ssl_bump terminate all

# Network ACLs
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# Port ACLs
acl SSL_ports port 443
acl Safe_ports port 80          # HTTP
acl Safe_ports port 443         # HTTPS
acl CONNECT method CONNECT
acl Safe_ports port 10000     # AWF api-proxy sidecar
acl Safe_ports port 10001     # AWF api-proxy sidecar
acl Safe_ports port 10002     # AWF api-proxy sidecar
acl Safe_ports port 10003     # AWF api-proxy sidecar
acl Safe_ports port 10004     # AWF api-proxy sidecar

# Access rules
# Deny unsafe ports (only allow Safe_ports defined above)
http_access deny !Safe_ports
# Allow CONNECT to Safe_ports instead of just SSL_ports (443)
# This is required because some HTTP clients (e.g., Node.js fetch) use CONNECT
# method even for HTTP connections when going through a proxy.
# See: gh-aw-firewall issue #189
http_access deny CONNECT !Safe_ports

# Allow connections to the AWF api-proxy sidecar before raw-IP deny rules.
# Some HTTP clients (e.g., Node.js fetch / undici ProxyAgent) route requests to
# the api-proxy via HTTP_PROXY without honouring NO_PROXY for raw IP addresses,
# causing them to arrive at Squid and be rejected by the raw-IP deny rule below.
# This allow rule fires first for the known api-proxy IP.
acl allow_api_proxy_ip dst 172.30.0.30
http_access allow allow_api_proxy_ip

# Allow the api-proxy sidecar unrestricted outbound through Squid.
# The sidecar must reach upstream API endpoints (e.g. api.anthropic.com for
# WIF/OIDC token exchange) that may not be in the agent's allow-list.
# The api-proxy is a trusted AWF component (not the agent threat model).
acl from_api_proxy src 172.30.0.30/32
http_access allow from_api_proxy

# Deny CONNECT to raw IP addresses (IPv4 and IPv6)
# Prevents bypassing domain-based filtering via direct IP connections
acl dst_ipv4 dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl dst_ipv6 dstdom_regex ^\[?[0-9a-fA-F:]+\]?$
http_access deny dst_ipv4
http_access deny dst_ipv6



# Deny requests to unknown domains (not in allow-list)
# This applies to all sources including localnet
http_access deny all

# Allow from trusted sources (after domain filtering)
http_access allow localnet
http_access allow localhost

# Deny everything else
http_access deny all

# Disable caching
cache deny all

# DNS settings - Squid resolves all domains for HTTP/HTTPS traffic
dns_nameservers 168.63.129.16
# A single transient upstream DNS failure (e.g. a SERVFAIL from an overloaded
# resolver during concurrent container startup) must not turn into a sustained
# false-positive block of an allowlisted domain. Squid's default
# negative_dns_ttl (1 minute) caches that one failure and rejects every
# request for the same domain for up to 60 seconds. Shrinking it means the
# very next lookup attempt re-queries the resolver instead of replaying the
# cached failure.
negative_dns_ttl 1 seconds
# Retry another configured nameserver quickly while keeping the total timeout
# above the retry interval. If dns_timeout is equal to Squid's default
# dns_retransmit_interval (5 seconds), Squid can hit the total timeout before
# sending the retry to the fallback nameserver.
dns_retransmit_interval 1 seconds
dns_timeout 10 seconds

# Forwarded headers
forwarded_for delete
via off

# Error page customization
error_directory /usr/share/squid/errors/en

# Memory and file descriptor limits
cache_mem 64 MB
maximum_object_size 0 KB

# Timeout settings for streaming/long-lived connections (AI inference APIs)
# read_timeout: Time to wait for data from server before giving up
# Increased to accommodate long AI inference calls and SSE streaming
read_timeout 30 minutes

# connect_timeout: Time to wait for TCP connection to origin server
connect_timeout 30 seconds

# request_timeout: Time to wait for client to send first request after connection
request_timeout 2 minutes

# persistent_request_timeout: Time to wait for next request on persistent connection
persistent_request_timeout 2 minutes

# pconn_timeout: How long to keep idle persistent connections to servers
pconn_timeout 2 minutes

# client_lifetime: Maximum time a client connection can be open
# Set high to accommodate long streaming sessions
client_lifetime 8 hours

# Close clients that send EOF before the TLS ClientHello to avoid Squid's
# empty-buffer assertion during ssl_bump peek. CONNECT tunnels handle half-close
# themselves, and SSE does not require a TCP half-close.
half_closed_clients off

# shutdown_lifetime: Time to wait for active connections during shutdown
# Set to 0 because this is an ephemeral proxy — no connection draining needed
shutdown_lifetime 0 seconds

# Debugging (can be enabled for troubleshooting)
# debug_options ALL,1 33,2
